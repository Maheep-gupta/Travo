# TEMPLATE — not active. Runs the database security tests (`npm run test:db`)
# on a GitHub-hosted runner, which has Docker. See docs/DB_TESTING.md, option B.
#
# To activate (founder decision, D-017): copy to .github/workflows/db-tests.yml
# and push. Before that, pin every `uses:` to a full 40-character commit SHA,
# with the tag as a trailing comment, e.g.
#   - uses: actions/checkout@<full-sha> # v4.x.y
# Look the SHAs up on the actions' own release pages; a tag can be moved by
# whoever controls the action's repository, a SHA can't.
#
# No secrets are used: `supabase start` creates a throwaway local stack inside
# the runner, with its own generated keys. No session data exists there.
# `persist-credentials: false` keeps the job's GITHUB_TOKEN out of .git/config,
# so later steps (npm install scripts, the Supabase CLI) can't read it.
name: db-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4 # pin to a full SHA before activating
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4 # pin to a full SHA before activating
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:release

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4 # pin to a full SHA before activating
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4 # pin to a full SHA before activating
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The CLI comes from devDependencies, so its version matches local development.
      - run: npx supabase start
      - run: npm run db:lint
      - run: npm run test:db
      - if: always()
        run: npx supabase stop --no-backup
